version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: sas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apple
      POSTGRES_DB: smart_attendance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sas_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:apple@db:5432/smart_attendance?schema=public

      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=yoursecurerandomsecretkeygoeshere
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
